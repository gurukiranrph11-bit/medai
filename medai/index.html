<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediScan AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="typography.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* THEME: new palette (indigo + orange). Change colors here. */
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#312E81",
            "primary-dark": "#1E1B4B",
            secondary: "#F97316",
            "secondary-dark": "#C2410C",
            "canvas-bg": "#F8F7FF",
            "surface-card": "#FFFFFF",
            "priority-critical": "#DC4444",
            "priority-high": "#F39A38",
            "priority-moderate": "#E8BD45",
            "priority-low": "#36A477",
            "border-subtle": "#E4E2F5"
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans", "sans-serif"],
            body: ["Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background-color: #F8F7FF; color: #1E1B4B; -webkit-font-smoothing: antialiased; }
    .glass-nav { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="flex flex-col antialiased">

  <!-- Header with logo -->
  <header class="glass-nav border-b border-border-subtle shadow-sm px-6 py-3 flex items-center justify-between z-40">
    <a href="index.html" class="flex items-center gap-3" onclick="goHome(event)">
      <!-- Put your logo at assets/logo.png. If it is missing, the icon below is shown instead. -->
      <img src="assets/logo.png" alt="MediScan AI Logo" class="h-10 w-auto"
           onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';"/>
      <div id="logo-fallback" style="display:none" class="w-10 h-10 rounded-xl bg-primary items-center justify-center shadow-sm">
        <span class="material-symbols-outlined text-secondary text-2xl">radiology</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="font-headline font-extrabold text-xl tracking-tight text-primary">MediScan</span>
        <span class="font-headline font-bold text-xl text-secondary">AI</span>
      </div>
    </a>
    <span class="hidden sm:block text-xs text-slate-500 font-mono">AI-assisted decision support • Synthetic prototype data</span>
  </header>

  <!-- Single app frame: starts at Login, router handles all other screens -->
  <main class="flex-1 min-h-0">
    <iframe id="app-iframe" src="login_registration_mediscan_ai/code.html" class="w-full h-full border-0 bg-white"></iframe>
  </main>

  <script>
    const iframe = document.getElementById('app-iframe');
    function goHome(e) {
      e.preventDefault();
      iframe.src = 'login_registration_mediscan_ai/code.html';
    }
  </script>
</body>
</html>
